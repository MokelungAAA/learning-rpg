<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Debug页面</title>
  <style>
    body { padding: 20px; font-family: Arial, sans-serif; }
    .status { padding: 10px; margin: 10px 0; border-radius: 8px; }
    .ok { background: #d4edda; color: #155724; }
    .error { background: #f8d7da; color: #721c24; }
    .info { background: #d1ecf1; color: #0c5460; }
    button { padding: 15px 40px; font-size: 20px; background: #6750A4; color: white; border: none; border-radius: 8px; cursor: pointer; margin: 10px; }
    button:hover { background: #5a4496; }
    pre { background: #f5f5f5; padding: 10px; border-radius: 4px; overflow: auto; }
  </style>
</head>
<body>
  <h1>Debug测试页面</h1>
  
  <div id="status"></div>
  
  <h2>测试1：基础按钮</h2>
  <button onclick="testBasic()">点击我测试基础功能</button>
  
  <h2>测试2：加载原始资源</h2>
  <button onclick="loadResources()">加载所有原始资源</button>
  
  <h2>测试3：直接调用window._launchApp</h2>
  <button onclick="testLaunchApp()">测试 _launchApp</button>
  
  <h2>Console输出</h2>
  <pre id="consoleOutput"></pre>

<script>
  const consoleOutput = document.getElementById('consoleOutput');
  const statusDiv = document.getElementById('status');
  
  function log(msg, type='info') {
    console.log(msg);
    const div = document.createElement('div');
    div.className = 'status ' + (type);
    div.textContent = new Date().toLocaleTimeString() + ' - ' + msg;
    consoleOutput.appendChild(div);
  }
  
  function testBasic() {
    log('基础按钮正常工作！', 'ok');
    statusDiv.innerHTML = '<div class="status ok">✅ 基础按钮正常！</div>';
  }
  
  function loadResources() {
    log('开始加载资源...', 'info');
    
    // 加载CSS
    const cssLinks = [
      'css/theme.css',
      'css/layout.css',
      'css/components.css',
      'css/pages.css'
    ];
    cssLinks.forEach(href => {
      const link = document.createElement('link');
      link.rel = 'stylesheet';
      link.href = href;
      link.onload = () => log('✅ CSS loaded: ' + href, 'ok');
      link.onerror = () => log('❌ CSS failed: ' + href, 'error');
      document.head.appendChild(link);
    });
    
    // 加载JS
    const jsFiles = [
      'js/utils.js',
      'js/algorithms.js',
      'js/data.js',
      'js/app.js'
    ];
    let loaded = 0;
    jsFiles.forEach(src => {
      const script = document.createElement('script');
      script.src = src;
      script.onload = () => {
        log('✅ JS loaded: ' + src, 'ok');
        loaded++;
        if (loaded === jsFiles.length) {
          log('所有JS加载完成！', 'ok');
          checkGlobal();
        }
      };
      script.onerror = () => log('❌ JS failed: ' + src, 'error');
      document.body.appendChild(script);
    });
  }
  
  function checkGlobal() {
    log('检查全局变量...', 'info');
    
    const checks = [
      'window._launchApp',
      'SUBJECT_NAMES',
      'getLevelTitle',
      'appData'
    ];
    
    checks.forEach(name => {
      try {
        const exists = eval('typeof ' + name) !== 'undefined';
        log(name + ': ' + (exists ? '✅ 存在' : '❌ 不存在'), exists ? 'ok' : 'error');
      } catch(e) {
        log(name + ': 检查出错 - ' + e.message, 'error');
      }
    });
  }
  
  function testLaunchApp() {
    log('尝试调用 window._launchApp...', 'info');
    try {
      if (typeof window._launchApp === 'function') {
        log('找到 _launchApp 函数，现在调用...', 'info');
        window._launchApp();
        log('✅ _launchApp 调用完成', 'ok');
      } else {
        log('❌ _launchApp 不是函数！typeof is ' + typeof window._launchApp, 'error');
      }
    } catch(e) {
      log('❌ _launchApp 调用失败 - ' + e.message, 'error');
      console.error(e);
    }
  }
  
  log('Debug页面加载完成！', 'ok');
</script>
</body>
</html>
