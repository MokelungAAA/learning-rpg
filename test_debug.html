<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>调试</title>
    <style>
        body { padding: 20px; font-family: Arial, sans-serif; }
        .error { color: red; }
        .success { color: green; }
        .log { margin: 10px 0; padding: 5px; background: #f5f5f5; border-radius: 4px; }
    </style>
</head>
<body>
    <h1>调试页面</h1>

    <h2>Step 1: 检查文件引用</h2>
    <div id="test1"></div>

    <h2>Step 2: 加载原始页面资源</h2>
    <div id="test2"></div>

    <h2>Step 3: 检查全局变量</h2>
    <div id="test3"></div>

    <script>
        const log = (id, msg, isError = false) => {
            const el = document.getElementById(id);
            const div = document.createElement('div');
            div.className = isError ? 'log error' : 'log success';
            div.textContent = msg;
            el.appendChild(div);
        };

        // Test 1: 文件存在性
        log('test1', '开始检查...');

        // Test 2: 加载 CSS 和 JS 并测试
        const cssLinks = ['css/theme.css', 'css/layout.css', 'css/components.css', 'css/pages.css'];
        const jsFiles = ['js/utils.js', 'js/algorithms.js', 'js/data.js', 'js/app.js'];

        let cssLoaded = 0;
        let jsLoaded = 0;

        const loadCss = (href) => {
            return new Promise((resolve, reject) => {
                const link = document.createElement('link');
                link.rel = 'stylesheet';
                link.href = href;
                link.onload = () => resolve(href);
                link.onerror = () => reject(href);
                document.head.appendChild(link);
            });
        };

        const loadJs = (src) => {
            return new Promise((resolve, reject) => {
                const script = document.createElement('script');
                script.src = src;
                script.onload = () => resolve(src);
                script.onerror = () => reject(src);
                document.body.appendChild(script);
            });
        };

        Promise.all(cssLinks.map(loadCss)).then(() => {
            log('test2', '✅ 所有 CSS 加载成功');
            return Promise.all(jsFiles.map(loadJs));
        }).then(() => {
            log('test2', '✅ 所有 JS 加载成功');
            setTimeout(checkGlobalVars, 100);
        }).catch((err) => {
            log('test2', '❌ 加载失败: ' + err, true);
        });

        function checkGlobalVars() {
            log('test3', '检查全局变量...');
            const vars = ['SUBJECT_NAMES', 'SUBJECT_ICONS', 'LEVEL_TITLES', 'getLevelTitle', 'appData', 'window._launchApp'];
            vars.forEach(v => {
                try {
                    let value;
                    if (v.startsWith('window.')) {
                        value = window[v.replace('window.', '')];
                    } else {
                        value = eval(v);
                    }
                    log('test3', `✅ ${v} = ${typeof value}` + (value !== undefined ? ' (已定义)' : ' (未定义)'), value === undefined);
                } catch (e) {
                    log('test3', `❌ ${v} - ${e}`, true);
                }
            });
            
            // 测试 renderImmediateOverview
            log('test3', '');
            log('test3', '测试 renderImmediateOverview 函数:');
            try {
                const testDiv = document.createElement('div');
                testDiv.id = 'page-overview';
                document.body.appendChild(testDiv);
                
                renderImmediateOverview();
                
                log('test3', `✅ renderImmediateOverview 执行完成，内容长度: ${testDiv.innerHTML.length}`);
                if (testDiv.innerHTML.length > 0) {
                    log('test3', '✅ 内容已生成: ' + testDiv.innerHTML.substring(0, 200));
                }
            } catch (e) {
                log('test3', `❌ renderImmediateOverview 出错: ${e}`, true);
                console.error(e);
            }
        }
    </script>
</body>
</html>
