<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Step by Step Debug</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; max-width: 800px; margin: 0 auto; }
    .step { border: 2px solid #ddd; padding: 15px; margin: 10px 0; border-radius: 8px; }
    .ok { background: #d4edda; border-color: #28a745; }
    .error { background: #f8d7da; border-color: #dc3545; }
    button { padding: 10px 20px; font-size: 16px; cursor: pointer; margin: 5px; }
    pre { background: #f5f5f5; padding: 10px; border-radius: 4px; overflow-x: auto; }
  </style>
</head>
<body>
  <h1>Step by Step 调试</h1>
  
  <div id="log"></div>
  
  <h2>手动测试按钮</h2>
  <button onclick="loadScript('js/utils.js')">1. 加载 utils.js</button>
  <button onclick="loadScript('js/algorithms.js')">2. 加载 algorithms.js</button>
  <button onclick="loadScript('js/data.js')">3. 加载 data.js</button>
  <button onclick="loadScript('js/app.js')">4. 加载 app.js</button>
  <button onclick="checkWindow()">检查 window._launchApp</button>
  
  <h2>自动加载</h2>
  <button onclick="autoLoadAll()">自动按顺序加载所有</button>
  
  <script>
    const logEl = document.getElementById('log');
    
    function log(msg, type='info') {
      console.log(msg);
      const div = document.createElement('div');
      div.className = 'step ' + type;
      div.innerHTML = '<strong>' + new Date().toLocaleTimeString() + ':</strong> ' + msg;
      logEl.appendChild(div);
    }
    
    function loadScript(src) {
      log('尝试加载: ' + src);
      return new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = src;
        script.onload = () => {
          log('✅ 成功加载: ' + src, 'ok');
          resolve();
        };
        script.onerror = (err) => {
          log('❌ 加载失败: ' + src, 'error');
          reject(err);
        };
        document.body.appendChild(script);
      });
    }
    
    async function autoLoadAll() {
      log('开始自动加载所有 JS 文件...');
      try {
        await loadScript('js/utils.js');
        log('✅ utils.js 加载完成，检查 SUBJECT_NAMES: ' + (typeof SUBJECT_NAMES !== 'undefined'));
        log('✅ getLevelTitle: ' + (typeof getLevelTitle === 'function'));
        
        await loadScript('js/algorithms.js');
        log('✅ algorithms.js 加载完成');
        
        await loadScript('js/data.js');
        log('✅ data.js 加载完成，检查 appData: ' + (typeof appData !== 'undefined'));
        
        await loadScript('js/app.js');
        log('✅ app.js 加载完成');
        
        checkWindow();
      } catch (e) {
        log('❌ 加载过程出错: ' + e, 'error');
        console.error(e);
      }
    }
    
    function checkWindow() {
      log('检查 window._launchApp...');
      if (typeof window._launchApp === 'function') {
        log('✅ 找到了！window._launchApp 是函数!', 'ok');
        log('调用测试...');
        try {
          // 这里不真的调用，只是测试
          log('函数体预览: ' + window._launchApp.toString().substring(0, 100) + '...');
        } catch (e) {
          log('❌ 测试调用出错: ' + e, 'error');
        }
      } else {
        log('❌ window._launchApp 不是函数！typeof 是 ' + typeof window._launchApp, 'error');
        log('window 对象 keys: ' + Object.keys(window).filter(k => k.includes('launch')).join(', '));
      }
    }
    
    log('页面加载完成！', 'ok');
  </script>
</body>
</html>
