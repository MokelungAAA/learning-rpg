      var dark = mode === 'dark' || (mode === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    } catch(e) {}
  </script>

<body>
  <div id="page-container"></div>
  <script src="data/sync-config.js"></script>
  <script src="data/lts_study_records.js"></script>
  <script>
    // 诊断：检查数据是否正确加载
    (function() {
      var d = window.LTS_RECORDS_DATA;
      var c = window.LTS_SYNC_CONFIG;
      var r = d && d.records ? d.records : [];
      var xp = r.reduce(function(s, x) { return s + (x.xp || 0); }, 0);
      console.log('[LTS DIAG] records=' + r.length + ', totalXP=' + xp + ', syncToken=' + (c && c.token ? 'OK' : 'MISSING'));
      if (r.length === 0) console.error('[LTS DIAG] NO DATA LOADED - window.LTS_RECORDS_DATA is empty or missing');
    })();
  </script>
  <script>
    // 开屏预遮罩：在 ES module 加载前同步盖住屏幕，防止主界面闪烁
    (function() {
      try {
        var s = JSON.parse(localStorage.getItem('lts_settings') || '{}');
        if (s.launchScreen === false) return;
        var h = new Date().getHours();
        var bg;
        if (h >= 5 && h < 12) bg = '#f5ede3';
        else if (h >= 12 && h < 17) bg = '#e8eef4';
        else if (h >= 17 && h < 20) bg = '#e8e2ed';
        else bg = '#1e2130';
        var dark = document.documentElement.getAttribute('data-theme') === 'dark';
        if (dark) bg = '#1e2130';
        var el = document.createElement('div');
        el.id = 'launch-pre-overlay';
        el.style.cssText = 'position:fixed;inset:0;z-index:99999;background:' + bg;
        document.documentElement.appendChild(el);
      } catch(e) {}
    })();
  </script>
  <script type="module" src="js/app.js"></script>
</body>
