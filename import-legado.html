function doAll(){
const btn=document.getElementById('btn');
const msg=document.getElementById('msg');
const detail=document.getElementById('detail');
if(!confirm('将清空现有阅读记录并重新导入220条日记录，确定？'))return;
btn.disabled=true;btn.textContent='清空中...';

// 清空
localStorage.removeItem('lts_reading_records');

// 导入
btn.textContent='导入中...';
const records=[];
for(const r of D){
// 用本地时间而非UTC，避免时区偏移导致日期错位
const ts=r.d+'T12:00:00';
records.push({
recordID:'rd-legado-'+Date.now()+'-'+Math.random().toString(36).slice(2,6),
timestamp:ts,bookTitle:r.n,author:r.a,
category:gc(r.n,r.a),status:'reading',
durationMinutes:r.m,pageStart:0,pageEnd:0,pagesRead:0,
completion:0,format:'ebook',rating:0,
notes:'从 Legado 导入'
});
}

try{
localStorage.setItem('lts_reading_records',JSON.stringify(records));
msg.className='msg ok';
msg.innerHTML='✅ 完成！已清空旧数据并导入 <b>'+records.length+'</b> 条每日阅读记录<br>涵盖 59 本书，2026.02.26 ~ 05.20';
detail.textContent='关闭此页面，回到 LTS 应用刷新查看（读完超过30天的书会自动标记为已读完）';
}catch(e){
msg.className='msg err';msg.textContent='❌ 失败: '+e.message;
}
btn.textContent='已完成';
}
